name: Nightly Sanji orders
on:
  workflow_dispatch:
  schedule:
    # 03:00 UTC is 10pm EST and 11pm EDT, matching the course example.
    - cron: "0 3 * * *"
permissions:
  contents: write
  pages: write
concurrency:
  group: nightly-sanji-orders
  cancel-in-progress: false
jobs:
  orders:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Generate next-session orders
        id: generate
        continue-on-error: true
        run: python assignment6/nightly.py
      - name: Commit orders and request Pages build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add open_orders.json mkt/open_orders.json assignment6/status.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update nightly Sanji orders'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds" --silent
      - name: Report data failure
        if: steps.generate.outcome == 'failure'
        run: exit 1
