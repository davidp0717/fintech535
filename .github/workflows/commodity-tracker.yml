name: Daily commodity thesis tracker
on:
  workflow_dispatch:
  schedule:
    - cron: '40 2 * * 2-6'
permissions:
  contents: write
  pages: write
concurrency:
  group: commodity-tracker
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install 'pandas>=2,<3'
      - run: python final-project/refresh.py
      - name: Publish snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! git diff --quiet -- final-project/tracker.json; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add final-project/tracker.json
            git commit -m 'Update commodity futures and options tracker'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds" --silent
