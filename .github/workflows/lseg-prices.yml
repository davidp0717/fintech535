name: Refresh LSEG daily prices
on:
  workflow_dispatch:
    inputs:
      rics:
        description: Space-separated LSEG instrument codes
        required: true
        default: AAPL.O MSFT.O
permissions:
  contents: write
  pages: write
concurrency:
  group: refresh-lseg-prices
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Fetch prices and save the plot
        env:
          RICS: ${{ inputs.rics }}
          LSEG_APP_KEY: ${{ secrets.LSEG_APP_KEY }}
          LSEG_USERNAME: ${{ secrets.LSEG_USERNAME }}
          LSEG_PASSWORD: ${{ secrets.LSEG_PASSWORD }}
        run: |
          read -ra symbols <<< "$RICS"
          python assignment5/refresh.py -- "${symbols[@]}"
      - name: Publish refreshed chart to GitHub Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! git diff --quiet -- assignment5/prices.json; then
            git config user.name github-actions[bot]
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add assignment5/prices.json
            git commit -m 'Refresh LSEG daily prices'
            git push
          fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds" --silent
